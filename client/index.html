<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <title>Les Fermes Soulard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var RELOAD_QUERY_PARAM = 'joreload';
        window.__jowebsiteReloadOnce = function (storageKey) {
          try {
            if (!window.sessionStorage.getItem(storageKey)) {
              window.sessionStorage.setItem(storageKey, '1');
              window.location.reload();
            }
            return;
          } catch (_err) {
            try {
              var url = new URL(window.location.href);
              if (url.searchParams.get(RELOAD_QUERY_PARAM) !== '1') {
                url.searchParams.set(RELOAD_QUERY_PARAM, '1');
                window.location.replace(url.toString());
              }
            } catch (_err2) {
              window.location.reload();
            }
          }
        };
        window.__jowebsiteHandleEntryLoadError = function (event) {
          window.__jowebsiteReloadOnce('jowebsite:entry-reload-attempted');
        };
      })();
    </script>
    <script
      type="module"
      src="/src/main.jsx"
      onerror="window.__jowebsiteHandleEntryLoadError && window.__jowebsiteHandleEntryLoadError(event)"
    ></script>
  </body>
</html>
