    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <script>
      (function () {
        window.__jowebsiteHandleEntryLoadError = function (event) {
          var src = String((event && event.target && event.target.src) || '');
          var key = 'jowebsite:entry-reload-attempted:' + (src || 'unknown');
          try {
            if (!window.sessionStorage.getItem(key)) {
              window.sessionStorage.setItem(key, '1');
              window.location.reload();
            }
          } catch (_err) {
            // Ignore storage errors in restrictive browser contexts.
          }
        };
      })();
    </script>
    <script
      type="module"
      src="/src/main.jsx"
      onerror="window.__jowebsiteHandleEntryLoadError && window.__jowebsiteHandleEntryLoadError(event)"
    ></script>
  </body>
</html>
