name: Heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat URL
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "HEARTBEAT_URL secret not set; skipping."
            exit 0
          fi
          curl -fsS "$HEARTBEAT_URL" || true
